services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinic_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/clinic_management
      SECRET_KEY: change-this-in-production
      FRONTEND_URL: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
